<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas de oftalmología</title>
<style>
  :root{
    --bg:#0f1011; --panel:#161718; --panel-2:#1b1d1f; --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.14);
    --tx:#e9e9e7; --tx-2:#a6abaf; --tx-3:#6f7478;
    --acc:#d6007a;            /* acción primaria y selección, nada más */
    --ann:#f0c05a;            /* amarillo de anotación: significa "etiqueta" */
    --ok:#4ea36b; --err:#c4574f;
    --r-ctrl:10px; --r-card:14px;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  /* ---------- barra superior ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(15,16,17,.94);
         border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .head{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:-.01em}
  .marca svg{color:var(--tx-2)}
  .meta{font-size:12px;color:var(--tx-3);letter-spacing:.01em}
  .nav{display:flex;gap:2px;margin-left:auto;background:var(--panel);border:1px solid var(--line);
       border-radius:var(--r-ctrl);padding:2px}
  .nav button{appearance:none;border:0;background:transparent;color:var(--tx-2);font:inherit;font-size:13px;
       padding:6px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .nav button:hover{color:var(--tx)}
  .nav button[aria-selected="true"]{background:var(--panel-2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line-strong)}
  .nav svg{opacity:.75}

  .inter{display:flex;align-items:center;gap:10px}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx-2);cursor:pointer;
          user-select:none;background:transparent;border:0;font-family:inherit;padding:4px}
  .switch .pista{width:30px;height:18px;border-radius:9px;background:var(--panel-2);
       border:1px solid var(--line-strong);position:relative;transition:background .15s}
  .switch .pista::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
       background:var(--tx-3);transition:transform .15s,background .15s}
  .switch[aria-checked="true"] .pista{background:rgba(240,192,90,.18);border-color:rgba(240,192,90,.5)}
  .switch[aria-checked="true"] .pista::after{transform:translateX(12px);background:var(--ann)}

  /* ---------- contenido ---------- */
  main{max-width:1440px;margin:0 auto;padding:24px 24px 80px}
  .grupo{margin:32px 0 12px;font-size:12px;color:var(--tx-3)}
  .grupo:first-child{margin-top:8px}
  .tema{margin-bottom:28px}
  .tema h2{font-size:15px;font-weight:500;margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
  .tema h2 .cuenta{font-size:11px;color:var(--tx-3);letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
  .thumb{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;
         cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit;transition:border-color .15s}
  .thumb:hover{border-color:var(--line-strong)}
  .thumb img{width:100%;height:148px;object-fit:cover;display:block;background:#000}
  .thumb .cap{padding:8px 10px;font-size:11.5px;color:var(--tx-3);display:flex;justify-content:space-between;gap:8px}
  .thumb .cap span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thumb .cap .anot{color:rgba(240,192,90,.85);flex:0 0 auto}

  /* ---------- lienzo con etiquetas ---------- */
  .lienzo{position:relative;display:block;background:#000;border-radius:var(--r-card);overflow:hidden;line-height:0}
  .lienzo img{display:block;width:100%;height:auto;max-height:74vh;object-fit:contain;margin:0 auto}
  .lienzo svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .lienzo.editando{cursor:crosshair}
  .et{position:absolute;transform:translate(-50%,-100%);background:rgba(12,13,14,.94);
      border:1px solid rgba(240,192,90,.65);color:#f4dfa8;border-radius:6px;padding:2px 7px;
      font-size:11px;white-space:nowrap;pointer-events:auto;cursor:default;line-height:1.35;
      box-shadow:0 1px 0 rgba(0,0,0,.4)}
  .et .x{color:var(--err);font-weight:500;margin-left:6px;cursor:pointer}
  .lienzo.editando .et{cursor:pointer}

  /* ---------- lightbox ---------- */
  .lb{position:fixed;inset:0;background:rgba(8,9,10,.96);z-index:60;display:none;overflow:auto;padding:24px}
  .lb[data-open="1"]{display:block}
  .lb .caja{max-width:1080px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
            border-radius:var(--r-card);overflow:hidden}
  .lb .txt{padding:16px 20px 20px}
  .lb .fila{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .lb h3{margin:0;font-size:16px;font-weight:500}
  .lb .sub{color:var(--tx-3);font-size:12px;margin-top:2px}
  .acciones{display:flex;gap:8px;flex-wrap:wrap}
  .btn{appearance:none;font:inherit;font-size:13px;color:var(--tx);background:var(--panel-2);
       border:1px solid var(--line-strong);border-radius:var(--r-ctrl);padding:6px 12px;cursor:pointer;
       display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:rgba(255,255,255,.24)}
  .btn.primario{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.primario:hover{filter:brightness(1.06)}
  .btn.quieto{background:transparent;border-color:transparent;color:var(--tx-2)}
  .btn.quieto:hover{color:var(--tx);border-color:var(--line)}

  ul.hallazgos{margin:14px 0 0;padding:0;list-style:none;max-width:80ch}
  ul.hallazgos li{position:relative;padding-left:16px;margin-bottom:7px;color:var(--tx);font-size:14px}
  ul.hallazgos li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:1px;background:var(--line-strong)}
  .trampa{margin-top:14px;border-left:1px solid rgba(240,192,90,.55);padding:2px 0 2px 12px;font-size:13.5px;color:var(--tx-2)}
  .trampa b{color:var(--tx);font-weight:500}
  .cred{margin-top:14px;font-size:11.5px;color:var(--tx-3);line-height:1.5;word-break:break-word}
  .cred a{color:var(--tx-2)}

  /* ---------- estudiar ---------- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .chip{appearance:none;font:inherit;font-size:12.5px;color:var(--tx-2);background:transparent;
        border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
  .chip:hover{color:var(--tx);border-color:var(--line-strong)}
  .chip[aria-pressed="true"]{color:var(--tx);border-color:var(--line-strong);background:var(--panel)}
  .est{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:24px;align-items:start}
  .barra{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .navpar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .navpar .pos{font-size:12px;color:var(--tx-3)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px}
  .card h4{margin:0 0 6px;font-size:12px;font-weight:400;color:var(--tx-3)}

  /* ---------- examen ---------- */
  .prog{font-size:12px;color:var(--tx-3);margin-bottom:10px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .opts button{appearance:none;font:inherit;font-size:14px;text-align:left;color:var(--tx);
        background:var(--panel-2);border:1px solid var(--line-strong);border-radius:var(--r-ctrl);
        padding:11px 14px;cursor:pointer}
  .opts button:hover:not(:disabled){border-color:rgba(255,255,255,.26)}
  .opts button:disabled{cursor:default;opacity:.85}
  .opts button.ok{border-color:var(--ok);background:rgba(78,163,107,.12)}
  .opts button.mal{border-color:var(--err);background:rgba(196,87,79,.12)}
  .preg{font-size:15px;font-weight:500;margin:14px 0 0}
  .fb{margin-top:14px;font-size:14px}
  .fb .titulo{font-weight:500}
  .fb .titulo.ok{color:#7cc798}
  .fb .titulo.mal{color:#e08a83}
  .res{font-size:28px;font-weight:500;letter-spacing:-.02em}
  .vacio{color:var(--tx-3);font-size:13px}

  :focus-visible{outline:2px solid rgba(240,192,90,.7);outline-offset:2px;border-radius:6px}
  @media(max-width:760px){
    .est{grid-template-columns:1fr}
    .opts{grid-template-columns:1fr}
    .head{padding:12px 16px;gap:12px}
    main{padding:16px 16px 64px}
    .nav{order:3;width:100%;justify-content:space-between}
  }
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="marca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle>
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path></svg>
      Atlas de oftalmología
    </div>
    <div class="meta mono" id="info"></div>
    <nav class="nav" role="tablist">
      <button id="t_gal" role="tab" aria-selected="true" onclick="vista('gal')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Galería</button>
      <button id="t_est" role="tab" aria-selected="false" onclick="vista('est')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path>
          <path d="M4 18.5h15"></path></svg>Estudiar</button>
      <button id="t_exa" role="tab" aria-selected="false" onclick="vista('exa')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"></path>
          <path d="M8 9h7M8 13h5"></path></svg>Examen</button>
    </nav>
    <button class="switch" id="btnEtiq" role="switch" aria-checked="true" onclick="alternarEtiquetas()">
      <span class="pista"></span><span>Etiquetas</span>
    </button>
  </div>
</header>

<main>
  <div id="gal"></div>
  <div id="est" hidden></div>
  <div id="exa" hidden></div>
</main>

<div class="lb" id="lb" data-open="0" onclick="if(event.target.id==='lb')cerrarLb()">
  <div class="caja" id="lbCaja"></div>
</div>

<script>
let DATOS = null, TEMA_SEL = null, IDX = 0, EXAMEN = null, I_EXA = 0, ACIERTOS = 0, RESP = null;
let ETIQ_ON = localStorage.getItem('atlas_etiq') !== '0';
let EDIT = false, LB_IMG = null;

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(ruta, datos){
  const o = datos ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(datos)} : {};
  return (await fetch(ruta, o)).json();
}

async function cargar(){
  DATOS = await api('/api/datos');
  $('info').textContent = DATOS.temas.length + ' temas · ' + (DATOS.total_imagenes||0) + ' imágenes';
  $('btnEtiq').setAttribute('aria-checked', ETIQ_ON ? 'true' : 'false');
  pintarGaleria();
  if (TEMA_SEL) pintarEstudiar();
}

function alternarEtiquetas(){
  ETIQ_ON = !ETIQ_ON;
  localStorage.setItem('atlas_etiq', ETIQ_ON ? '1' : '0');
  $('btnEtiq').setAttribute('aria-checked', ETIQ_ON ? 'true' : 'false');
  if (LB_IMG) abrirLb(LB_IMG.tema, LB_IMG.i);
  else if (TEMA_SEL && !$('est').hidden) pintarEstudiar();
  pintarGaleria();
}

function vista(v){
  ['gal','est','exa'].forEach(x => {
    $('t_'+x).setAttribute('aria-selected', x === v ? 'true' : 'false');
    $('t_'+x).querySelector('svg').style.opacity = x === v ? '1' : '.75';
  });
  $('gal').hidden = v !== 'gal';
  $('est').hidden = v !== 'est';
  $('exa').hidden = v !== 'exa';
  if (v === 'est') { if (!TEMA_SEL && DATOS.temas.length) TEMA_SEL = DATOS.temas[0].nombre; pintarEstudiar(); }
  if (v === 'exa' && !EXAMEN) nuevoExamen();
}

/* ---------------------------------------------------------------- galería */
function pintarGaleria(){
  let grupo = '', h = '';
  for (const t of DATOS.temas){
    if (t.grupo !== grupo){ grupo = t.grupo; h += `<div class="grupo">${esc(grupo)}</div>`; }
    h += `<section class="tema"><h2>${esc(t.nombre)}
            <span class="cuenta mono">${t.imagenes.length}</span></h2><div class="grid">` +
      t.imagenes.map((im,i) => {
        const n = (im.etiquetas||[]).length;
        return `<button class="thumb" onclick="abrirLb('${encodeURIComponent(t.nombre)}',${i})">
          <img src="/imagenes/${encodeURI(im.archivo.split('/').slice(1).join('/'))}" loading="lazy" alt="">
          <div class="cap"><span>${esc(im.titulo)}</span>${n ? `<span class="anot mono">${n}</span>` : ''}</div>
        </button>`;
      }).join('') + `</div></section>`;
  }
  $('gal').innerHTML = h || '<p class="vacio">No hay imágenes todavía.</p>';
}

/* ---------------------------------------------------------------- etiquetas */
function lienzoHTML(im, edit, slot){
  const src = '/imagenes/' + encodeURI(im.archivo.split('/').slice(1).join('/'));
  return `<div class="lienzo ${edit?'editando':''}" id="lienzo-${slot}" data-img="${im.id}">
      <img src="${src}" alt="" onload="pintarFlechas('${slot}')">
      <svg id="flechas-${slot}"></svg>
    </div>`;
}

function pintarFlechas(slot){
  slot = slot || (LB_IMG ? 'lb' : 'est');
  const lienzo = $('lienzo-' + slot); if (!lienzo) return;
  const img = lienzo.querySelector('img');
  const svg = $('flechas-' + slot); if (!img || !svg) return;
  const w = img.clientWidth, h = img.clientHeight;
  if (!w || !h) return;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = '';
  lienzo.querySelectorAll('.et').forEach(e => e.remove());
  if (!ETIQ_ON) return;
  const im = imagenActual(); if (!im) return;

  (im.etiquetas || []).forEach((e, idx) => {
    const px = e.x * w, py = e.y * h;
    const arriba = py > 90;
    const salto = 58 + (idx % 2) * 18;
    const ly = Math.min(Math.max(arriba ? py - salto : py + salto, 18), h - 6);
    const desliz = ((idx % 3) - 1) * 46;
    const lx = Math.min(Math.max(px + desliz, 52), w - 52);

    const chip = document.createElement('div');
    chip.className = 'et';
    chip.style.left = lx + 'px';
    chip.style.top = ly + 'px';
    chip.innerHTML = esc(e.texto) + (EDIT ? ' <span class="x" title="borrar">✕</span>' : '');
    chip.onclick = (ev) => { ev.stopPropagation(); if (EDIT) borrarEtiqueta(e.id); };
    lienzo.appendChild(chip);

    const x1 = lx, y1 = ly + (arriba ? 4 : -12);
    const ang = Math.atan2(py - y1, px - x1);
    const L = 7, Wd = 3.4;
    const p1x = px - L * Math.cos(ang) + Wd * Math.sin(ang);
    const p1y = py - L * Math.sin(ang) - Wd * Math.cos(ang);
    const p2x = px - L * Math.cos(ang) - Wd * Math.sin(ang);
    const p2y = py - L * Math.sin(ang) + Wd * Math.cos(ang);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML = `
      <line x1="${x1}" y1="${y1}" x2="${px}" y2="${py}" stroke="#f0c05a" stroke-width="1.2" opacity=".9"/>
      <polygon points="${px},${py} ${p1x},${p1y} ${p2x},${p2y}" fill="#f0c05a"/>`;
    svg.appendChild(g);
  });

  if (EDIT){
    lienzo.onclick = (ev) => {
      const r = img.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width;
      const y = (ev.clientY - r.top) / r.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      const texto = prompt('Texto de la etiqueta (papila, hemorragia en llama, exudado duro):');
      if (!texto) return;
      agregarEtiqueta(im.id, x, y, texto);
    };
  } else {
    lienzo.onclick = null;
  }
}

function imagenActual(){
  if (LB_IMG) { const t = buscarTema(LB_IMG.tema); return t && t.imagenes[LB_IMG.i]; }
  const t = buscarTema(TEMA_SEL); return t && t.imagenes[IDX];
}

async function agregarEtiqueta(imagen_id, x, y, texto){
  await api('/api/etiqueta', {imagen_id, x, y, texto});
  await cargar();
}

async function borrarEtiqueta(id){
  if (!confirm('¿Borrar esta etiqueta?')) return;
  await api('/api/etiqueta/' + id + '/borrar', {});
  await cargar();
}

/* ---------------------------------------------------------------- lightbox */
function buscarTema(nombre){ return DATOS.temas.find(t => t.nombre === decodeURIComponent(nombre)); }

function abrirLb(nombre, i){
  const t = buscarTema(nombre); if (!t) return;
  const im = t.imagenes[i]; if (!im) return;
  LB_IMG = {tema: nombre, i};
  $('lbCaja').innerHTML = `
    ${lienzoHTML(im, EDIT, 'lb')}
    <div class="txt">
      <div class="fila">
        <div><h3>${esc(t.nombre)}</h3><div class="sub">${esc(t.grupo)}</div></div>
        <div class="acciones">
          <button class="btn" onclick="toggleEdit()">${EDIT ? 'Terminar etiquetas' : 'Agregar etiquetas'}</button>
          <button class="btn quieto" onclick="cerrarLb()">Cerrar</button>
        </div>
      </div>
      <ul class="hallazgos">${(t.claves||[]).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      ${t.trampa ? `<div class="trampa"><b>Trampa de examen.</b> ${esc(t.trampa)}</div>` : ''}
      <div class="cred">Foto: ${esc(im.titulo)} — ${esc(im.autor || 'autor no indicado')} · ${esc(im.licencia||'')}
        ${im.fuente ? ` · <a href="${esc(im.fuente)}" target="_blank" rel="noopener">Wikimedia Commons</a>` : ''}</div>
    </div>`;
  $('lb').dataset.open = '1';
  setTimeout(() => pintarFlechas('lb'), 40);
}

function toggleEdit(){ EDIT = !EDIT; if (LB_IMG) abrirLb(LB_IMG.tema, LB_IMG.i); else pintarEstudiar(); }
function cerrarLb(){ $('lb').dataset.open = '0'; $('lbCaja').innerHTML = ''; LB_IMG = null; }

/* ---------------------------------------------------------------- estudiar */
function pintarEstudiar(){
  const t = buscarTema(TEMA_SEL) || DATOS.temas[0]; if (!t) return;
  TEMA_SEL = t.nombre;
  if (IDX >= t.imagenes.length) IDX = 0;
  const im = t.imagenes[IDX];
  $('est').innerHTML = `
    <div class="barra" style="margin-bottom:16px">
      <select id="selTema" onchange="TEMA_SEL=this.value;IDX=0;pintarEstudiar()"
              style="font:inherit;font-size:13.5px;color:var(--tx);background:var(--panel);
                     border:1px solid var(--line-strong);border-radius:10px;padding:7px 12px;min-width:280px">
        ${DATOS.temas.map(x => `<option ${x.nombre===t.nombre?'selected':''} value="${esc(x.nombre)}">${esc(x.nombre)}</option>`).join('')}
      </select>
      <span class="meta mono">${IDX+1} / ${t.imagenes.length}</span>
      <span style="flex:1"></span>
      <button class="btn" onclick="toggleEdit()">${EDIT ? 'Terminar etiquetas' : 'Agregar etiquetas'}</button>
    </div>
    <div class="est">
      <div>
        ${lienzoHTML(im, EDIT, 'est')}
        <div class="navpar">
          <button class="btn quieto" onclick="IDX=(IDX-1+${t.imagenes.length})%${t.imagenes.length};pintarEstudiar()">Anterior</button>
          <button class="btn quieto" onclick="IDX=(IDX+1)%${t.imagenes.length};pintarEstudiar()">Siguiente</button>
        </div>
      </div>
      <div class="card">
        <h4>${esc(t.grupo)}</h4>
        <div style="font-size:16px;font-weight:500;margin-bottom:4px">${esc(t.nombre)}</div>
        <ul class="hallazgos">${(t.claves||[]).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        ${t.trampa ? `<div class="trampa"><b>Trampa de examen.</b> ${esc(t.trampa)}</div>` : ''}
        <div class="cred">Foto: ${esc(im.titulo)} — ${esc(im.autor||'')} · ${esc(im.licencia||'')}</div>
      </div>
    </div>`;
  setTimeout(() => pintarFlechas('est'), 60);
}

window.addEventListener('resize', () => pintarFlechas());

/* ---------------------------------------------------------------- examen */
async function nuevoExamen(){
  RESP = null; I_EXA = 0; ACIERTOS = 0; EXAMEN = null;
  $('exa').innerHTML = '<p class="vacio">Cargando…</p>';
  const d = await api('/api/examen?n=10');
  if (d.error){ $('exa').innerHTML = `<p class="vacio">${esc(d.error)}</p>`; return; }
  EXAMEN = d.preguntas; pintarPregunta();
}

function pintarPregunta(){
  if (I_EXA >= EXAMEN.length) return pintarResultado();
  const p = EXAMEN[I_EXA];
  $('exa').innerHTML = `<div class="card">
      <div class="prog mono">${I_EXA+1} / ${EXAMEN.length} · ${ACIERTOS} correctas</div>
      <div class="lienzo" style="background:#000">
        <img src="/imagenes/${encodeURI(p.imagen.split('/').slice(1).join('/'))}" alt=""
             style="width:100%;max-height:58vh;object-fit:contain">
      </div>
      <div class="preg">¿Cuál es el diagnóstico?</div>
      <div class="opts" id="opts">${p.opciones.map((o,i) =>
        `<button onclick="responder(${i})">${esc(o)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
    </div>`;
}

function responder(i){
  const p = EXAMEN[I_EXA]; if (RESP !== null) return;
  RESP = p.opciones[i];
  const bien = RESP === p.correcta;
  if (bien) ACIERTOS++;
  document.querySelectorAll('#opts button').forEach((b, j) => {
    if (p.opciones[j] === p.correcta) b.classList.add('ok');
    else if (j === i) b.classList.add('mal');
    b.disabled = true;
  });
  const tema = DATOS.temas.find(t => t.nombre === p.correcta) || {};
  $('fb').innerHTML = `<div class="titulo ${bien?'ok':'mal'}">${bien ? 'Correcto' : 'Era ' + esc(p.correcta)}</div>
    ${tema.trampa ? `<div class="trampa">${esc(tema.trampa)}</div>` : ''}
    <p><button class="btn" onclick="siguiente()">Siguiente</button></p>`;
}

function siguiente(){ I_EXA++; RESP = null; pintarPregunta(); }

function pintarResultado(){
  const pct = Math.round(ACIERTOS / EXAMEN.length * 100);
  $('exa').innerHTML = `<div class="card">
    <div class="res mono">${ACIERTOS} / ${EXAMEN.length} · ${pct}%</div>
    <p style="color:var(--tx-2);max-width:60ch">${pct >= 80 ? 'Distingues los cuadros. Sube la dificultad con temas que aún no has leído.'
      : pct >= 60 ? 'Zona de aprobado, pero hay diagnósticos que se te confunden.'
      : 'Flojo: vuelve a la galería de los temas que fallaste antes de repetir el examen.'}</p>
    <p><button class="btn primario" onclick="nuevoExamen()">Otro examen</button>
       <button class="btn quieto" onclick="vista('gal')">Ver galería</button></p></div>`;
}

cargar();
</script>
