<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas de oftalmología · ENARM</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2b3444;--tx:#e6edf3;--dim:#8b98a9;
        --acc:#D6007A;--acc2:#ff4fa3;--ok:#2ea043;--err:#f85149;--warn:#d29922;--blue:#388bfd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
         padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0;font-weight:700}
  h1 span{color:var(--acc)}
  button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);
         border-radius:9px;padding:6px 13px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .cont{padding:14px 16px 60px;max-width:1400px;margin:0 auto}
  .grupo{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .tema{margin-bottom:22px}
  .tema h2{font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .thumb{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
  .thumb img{width:100%;height:150px;object-fit:cover;display:block;background:#000}
  .thumb .cap{padding:6px 8px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb:hover{border-color:var(--acc)}
  /* lienzo con etiquetas */
  .lienzo{position:relative;display:inline-block;line-height:0;background:#000;width:100%}
  .lienzo img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;margin:0 auto}
  .lienzo svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .et{position:absolute;transform:translate(-50%,-100%);background:rgba(13,17,23,.92);
      border:1px solid var(--warn);color:#ffe9a8;border-radius:7px;padding:2px 7px;font-size:11px;
      white-space:nowrap;pointer-events:auto;cursor:pointer;line-height:1.3}
  .et.verde{border-color:#31c48d;color:#b7f5dd}
  .et.azul{border-color:#6d8cff;color:#cfdcff}
  .et.rosa{border-color:#ff4fa3;color:#ffd0e6}
  .et .x{color:var(--err);font-weight:700;margin-left:6px}
  .et.edit{cursor:crosshair}
  .lienzo.editando{cursor:crosshair;outline:2px dashed var(--acc);outline-offset:-2px}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(5,8,12,.95);z-index:50;display:none;overflow:auto;padding:20px}
  .lb.on{display:block}
  .lb .caja{max-width:1100px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .lb .txt{padding:14px 18px}
  .lb .cred{font-size:11px;color:var(--dim);margin-top:8px;word-break:break-word}
  ul.claves{margin:8px 0 0;padding-left:20px}
  ul.claves li{margin-bottom:6px}
  .trampa{margin-top:10px;background:#2a1220;border-left:3px solid var(--acc);padding:8px 12px;border-radius:8px;font-size:13px}
  .cerrar{float:right}
  /* estudiar */
  .est{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chips button{font-size:12px;padding:4px 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 8px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .nav{display:flex;gap:8px;justify-content:space-between;margin-top:10px;align-items:center}
  .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .barra button{font-size:12px;padding:4px 10px}
  /* examen */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .opts button{text-align:left;padding:10px 12px}
  .opts button.ok{background:#0f2f1b;border-color:var(--ok)}
  .opts button.mal{background:#3a1216;border-color:var(--err)}
  .prog{font-size:12px;color:var(--dim)}
  .res{font-size:22px;font-weight:700}
  @media(max-width:820px){ .est{grid-template-columns:1fr} .opts{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>👁️ Atlas de oftalmología <span>·</span> ENARM</h1>
  <div style="flex:1"></div>
  <button id="t_gal" class="on" onclick="vista('gal')">🖼 Galería</button>
  <button id="t_est" onclick="vista('est')">📚 Estudiar</button>
  <button id="t_exa" onclick="vista('exa')">📝 Examen</button>
  <button id="btnEtiq" onclick="alternarEtiquetas()">🏷 Etiquetas: ON</button>
  <span id="info" class="badge"></span>
</header>

<div class="cont">
  <div id="gal"></div>
  <div id="est" style="display:none"></div>
  <div id="exa" style="display:none"></div>
</div>

<div class="lb" id="lb" onclick="if(event.target.id==='lb')cerrarLb()">
  <div class="caja" id="lbCaja"></div>
</div>

<script>
let DATOS = null, TEMA_SEL = null, IDX = 0, EXAMEN = null, I_EXA = 0, ACIERTOS = 0, RESP = null;
let ETIQ_ON = localStorage.getItem('atlas_etiq') !== '0';
let EDIT = false, LB_IMG = null;

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORES = ['#ffd166', '#31c48d', '#6d8cff', '#ff4fa3'];

async function api(ruta, datos){
  const o = datos ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(datos)} : {};
  return (await fetch(ruta, o)).json();
}

async function cargar(){
  DATOS = await api('/api/datos');
  $('info').textContent = (DATOS.total_imagenes||0) + ' imágenes · ' + DATOS.temas.length + ' temas';
  $('btnEtiq').textContent = '🏷 Etiquetas: ' + (ETIQ_ON ? 'ON' : 'OFF');
  $('btnEtiq').classList.toggle('on', ETIQ_ON);
  pintarGaleria();
  if (TEMA_SEL) pintarEstudiar();
}

function alternarEtiquetas(){
  ETIQ_ON = !ETIQ_ON;
  localStorage.setItem('atlas_etiq', ETIQ_ON ? '1' : '0');
  $('btnEtiq').textContent = '🏷 Etiquetas: ' + (ETIQ_ON ? 'ON' : 'OFF');
  $('btnEtiq').classList.toggle('on', ETIQ_ON);
  pintarGaleria();
  if (TEMA_SEL) pintarEstudiar();
  if (LB_IMG) abrirLb(LB_IMG.tema, LB_IMG.i);
}

function vista(v){
  ['gal','est','exa'].forEach(x => $('t_'+x).classList.toggle('on', x === v));
  $('gal').style.display = v === 'gal' ? '' : 'none';
  $('est').style.display = v === 'est' ? '' : 'none';
  $('exa').style.display = v === 'exa' ? '' : 'none';
  if (v === 'est') { if (!TEMA_SEL && DATOS.temas.length) TEMA_SEL = DATOS.temas[0].nombre; pintarEstudiar(); }
  if (v === 'exa' && !EXAMEN) nuevoExamen();
}

/* ---------------------------------------------------------------- galería */
function pintarGaleria(){
  let grupo = '', h = '';
  for (const t of DATOS.temas){
    if (t.grupo !== grupo){ grupo = t.grupo; h += `<div class="grupo">${esc(grupo)}</div>`; }
    h += `<div class="tema"><h2>${esc(t.nombre)} <span class="badge">${t.imagenes.length} imágenes</span></h2><div class="grid">` +
      t.imagenes.map((im,i) => {
        const n = (im.etiquetas||[]).length;
        return `<div class="thumb" onclick="abrirLb('${encodeURIComponent(t.nombre)}',${i})">
          <img src="/imagenes/${encodeURI(im.archivo.split('/').slice(1).join('/'))}" loading="lazy" alt="">
          <div class="cap">${esc(im.titulo)}${n ? ' · 🏷'+n : ''}</div></div>`;
      }).join('') + `</div></div>`;
  }
  $('gal').innerHTML = h || '<div class="card">No hay imágenes.</div>';
}

/* ---------------------------------------------------------------- etiquetas */
function lienzoHTML(im, edit, slot){
  const src = '/imagenes/' + encodeURI(im.archivo.split('/').slice(1).join('/'));
  return `<div class="lienzo ${edit?'editando':''}" id="lienzo-${slot}" data-img="${im.id}">
      <img src="${src}" alt="" onload="pintarFlechas('${slot}')">
      <svg id="flechas-${slot}"></svg>
    </div>`;
}

function pintarFlechas(slot){
  slot = slot || (LB_IMG ? 'lb' : 'est');
  const lienzo = $('lienzo-' + slot); if (!lienzo) return;
  const img = lienzo.querySelector('img');
  const svg = $('flechas-' + slot); if (!img || !svg) return;
  const w = img.clientWidth, h = img.clientHeight;
  if (!w || !h) return;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = '';
  // quitar chips previos
  lienzo.querySelectorAll('.et').forEach(e => e.remove());
  if (!ETIQ_ON) return;
  const im = imagenActual(); if (!im) return;

  (im.etiquetas || []).forEach((e, idx) => {
    const px = e.x * w, py = e.y * h;
    // la etiqueta se separa del punto para que la flecha se vea; se escalona para no encimarse
    const arriba = py > 90;
    const salto = 58 + (idx % 2) * 18;
    const ly = arriba ? py - salto : py + salto;
    const desliz = ((idx % 3) - 1) * 46;
    const lx = Math.min(Math.max(px + desliz, 52), w - 52);
    const chip = document.createElement('div');
    chip.className = 'et ' + (['', 'verde', 'azul', 'rosa'][idx % 4]);
    chip.style.left = lx + 'px';
    chip.style.top = ly + 'px';
    chip.innerHTML = esc(e.texto) + (EDIT ? ` <span class="x" title="borrar">✕</span>` : '');
    chip.onclick = (ev) => { ev.stopPropagation(); if (EDIT) borrarEtiqueta(e.id); };
    lienzo.appendChild(chip);

    // linea desde la etiqueta hasta el punto + punta de flecha en el punto
    const x1 = lx, y1 = ly + (arriba ? 4 : -12);
    const ang = Math.atan2(py - y1, px - x1);
    const L = 7, Wd = 3.4;
    const p1x = px - L * Math.cos(ang) + Wd * Math.sin(ang);
    const p1y = py - L * Math.sin(ang) - Wd * Math.cos(ang);
    const p2x = px - L * Math.cos(ang) - Wd * Math.sin(ang);
    const p2y = py - L * Math.sin(ang) + Wd * Math.cos(ang);
    const flecha = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    flecha.innerHTML = `
      <line x1="${x1}" y1="${y1}" x2="${px}" y2="${py}" stroke="#ffd166" stroke-width="1.7" opacity="0.95"/>
      <polygon points="${px},${py} ${p1x},${p1y} ${p2x},${p2y}" fill="#ffd166"/>`;
    svg.appendChild(flecha);
  });

  if (EDIT){
    lienzo.onclick = (ev) => {
      const r = img.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width;
      const y = (ev.clientY - r.top) / r.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      const texto = prompt('Texto de la etiqueta (ej. "papila borrosa", "hemorragia en llama"):');
      if (!texto) return;
      agregarEtiqueta(im.id, x, y, texto);
    };
  } else {
    lienzo.onclick = null;
  }
}

function imagenActual(){
  if (LB_IMG) { const t = buscarTema(LB_IMG.tema); return t && t.imagenes[LB_IMG.i]; }
  const t = buscarTema(TEMA_SEL); return t && t.imagenes[IDX];
}

async function agregarEtiqueta(imagen_id, x, y, texto){
  await api('/api/etiqueta', {imagen_id, x, y, texto});
  await cargar();
}

async function borrarEtiqueta(id){
  if (!confirm('¿Borrar esta etiqueta?')) return;
  await api('/api/etiqueta/' + id + '/borrar', {});
  await cargar();
}

/* ---------------------------------------------------------------- lightbox */
function buscarTema(nombre){ return DATOS.temas.find(t => t.nombre === decodeURIComponent(nombre)); }

function abrirLb(nombre, i){
  const t = buscarTema(nombre); if (!t) return;
  const im = t.imagenes[i]; if (!im) return;
  LB_IMG = {tema: nombre, i};
  $('lbCaja').innerHTML = `
    ${lienzoHTML(im, EDIT, 'lb')}
    <div class="txt">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
        <div><b>${esc(t.nombre)}</b> <span class="badge">${esc(t.grupo)}</span></div>
        <div class="barra" style="margin:0">
          <button onclick="toggleEdit()">${EDIT ? '✅ Terminar etiquetas' : '✏️ Agregar etiquetas'}</button>
          <button onclick="cerrarLb()">✕ Cerrar</button>
        </div>
      </div>
      <ul class="claves">${(t.claves||[]).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      ${t.trampa ? `<div class="trampa">⚠️ <b>Trampa de examen:</b> ${esc(t.trampa)}</div>` : ''}
      <div class="cred">📷 ${esc(im.titulo)} — ${esc(im.autor || 'autor no indicado')} · ${esc(im.licencia||'')}
        ${im.fuente ? `<br><a style="color:#6d8cff" href="${esc(im.fuente)}" target="_blank">ver en Wikimedia Commons</a>` : ''}</div>
    </div>`;
  $('lb').classList.add('on');
  setTimeout(() => pintarFlechas('lb'), 40);
}

function toggleEdit(){ EDIT = !EDIT; if (LB_IMG) abrirLb(LB_IMG.tema, LB_IMG.i); else pintarEstudiar(); }
function cerrarLb(){ $('lb').classList.remove('on'); $('lbCaja').innerHTML = ''; LB_IMG = null; }

/* ---------------------------------------------------------------- estudiar */
function pintarEstudiar(){
  const t = buscarTema(TEMA_SEL) || DATOS.temas[0]; if (!t) return;
  TEMA_SEL = t.nombre;
  if (IDX >= t.imagenes.length) IDX = 0;
  const im = t.imagenes[IDX];
  $('est').innerHTML = `
    <div class="chips">${DATOS.temas.map(x =>
      `<button class="${x.nombre===t.nombre?'on':''}" onclick="TEMA_SEL=${JSON.stringify(x.nombre)};IDX=0;pintarEstudiar()">${esc(x.nombre.split('(')[0].trim())}</button>`).join('')}</div>
    <div class="est">
      <div>
        <div class="barra">
          <button onclick="toggleEdit()">${EDIT ? '✅ Terminar etiquetas' : '✏️ Agregar etiquetas'}</button>
          <button onclick="alternarEtiquetas()">🏷 Etiquetas: ${ETIQ_ON?'ON':'OFF'}</button>
        </div>
        ${lienzoHTML(im, EDIT, 'est')}
        <div class="nav">
          <button onclick="IDX=(IDX-1+${t.imagenes.length})%${t.imagenes.length};pintarEstudiar()">← anterior</button>
          <span class="badge">${IDX+1} / ${t.imagenes.length}</span>
          <button onclick="IDX=(IDX+1)%${t.imagenes.length};pintarEstudiar()">siguiente →</button>
        </div>
      </div>
      <div class="card">
        <h3>${esc(t.grupo)}</h3>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">${esc(t.nombre)}</div>
        <ul class="claves">${(t.claves||[]).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        ${t.trampa ? `<div class="trampa">⚠️ <b>Trampa de examen:</b> ${esc(t.trampa)}</div>` : ''}
        <div class="cred" style="font-size:11px;color:var(--dim);margin-top:10px">
          📷 ${esc(im.titulo)} — ${esc(im.autor||'')} · ${esc(im.licencia||'')}
        </div>
      </div>
    </div>`;
  setTimeout(() => pintarFlechas('est'), 60);
}

window.addEventListener('resize', () => pintarFlechas());

/* ---------------------------------------------------------------- examen */
async function nuevoExamen(){
  RESP = null; I_EXA = 0; ACIERTOS = 0; EXAMEN = null;
  $('exa').innerHTML = '<div class="card">Cargando examen…</div>';
  const d = await api('/api/examen?n=10');
  if (d.error){ $('exa').innerHTML = `<div class="card">${esc(d.error)}</div>`; return; }
  EXAMEN = d.preguntas; pintarPregunta();
}

function pintarPregunta(){
  if (I_EXA >= EXAMEN.length) return pintarResultado();
  const p = EXAMEN[I_EXA];
  $('exa').innerHTML = `<div class="card">
      <div class="prog">Pregunta ${I_EXA+1} de ${EXAMEN.length} · aciertos ${ACIERTOS}</div>
      <div class="lienzo"><img src="/imagenes/${encodeURI(p.imagen.split('/').slice(1).join('/'))}"
           style="width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:#000;margin-top:8px"></div>
      <div style="margin-top:10px;font-weight:600">¿Cuál es el diagnóstico?</div>
      <div class="opts" id="opts">${p.opciones.map((o,i) =>
        `<button onclick="responder(${i})">${esc(o)}</button>`).join('')}</div>
      <div id="fb" style="margin-top:10px"></div>
    </div>`;
}

function responder(i){
  const p = EXAMEN[I_EXA]; if (RESP !== null) return;
  RESP = p.opciones[i];
  const bien = RESP === p.correcta;
  if (bien) ACIERTOS++;
  document.querySelectorAll('#opts button').forEach((b, j) => {
    if (p.opciones[j] === p.correcta) b.classList.add('ok');
    else if (j === i) b.classList.add('mal');
    b.disabled = true;
  });
  const tema = DATOS.temas.find(t => t.nombre === p.correcta) || {};
  $('fb').innerHTML = `<div style="font-weight:700;color:${bien?'var(--ok)':'var(--err)'}">
      ${bien ? '✅ Correcto' : '❌ Era: ' + esc(p.correcta)}</div>
    ${tema.trampa ? `<div class="trampa">⚠️ ${esc(tema.trampa)}</div>` : ''}
    <button style="margin-top:10px" onclick="siguiente()">Siguiente →</button>`;
}

function siguiente(){ I_EXA++; RESP = null; pintarPregunta(); }

function pintarResultado(){
  const pct = Math.round(ACIERTOS / EXAMEN.length * 100);
  $('exa').innerHTML = `<div class="card">
    <div class="res">${ACIERTOS} / ${EXAMEN.length} · ${pct}%</div>
    <p style="color:var(--dim)">${pct >= 80 ? 'Vas bien: ya distingues los cuadros.' :
      pct >= 60 ? 'Vas en zona de aprobado, pero hay temas que se confunden.' :
      'Flojo: repite la galería de los temas que fallaste.'}</p>
    <button class="on" onclick="nuevoExamen()">🔁 Otro examen</button>
    <button onclick="vista('gal')">Ver galería</button></div>`;
}

cargar();
</script>
</body>
</html>
